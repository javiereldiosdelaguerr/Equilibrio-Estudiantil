<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Equilibrio Estudiantil</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Arial',sans-serif;
  background:#0f2027;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
}
.card{
  width:360px;
  padding:36px 30px;
  border-radius:20px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.12);
}
.logo{text-align:center;margin-bottom:20px}
.logo-circle{
  width:72px;height:72px;border-radius:50%;
  background:#85B7EB;margin:0 auto 10px;
  display:flex;align-items:center;justify-content:center;
  font-size:30px;
}
.logo h1{font-size:16px;font-weight:500;color:#85B7EB}
.logo p{font-size:12px;color:rgba(255,255,255,0.5);margin-top:2px}
.form-group{margin-bottom:14px}
.form-group input{
  width:100%;padding:12px 14px;
  border:1px solid rgba(255,255,255,0.15);
  border-radius:10px;
  background:rgba(255,255,255,0.1);
  color:#fff;font-size:14px;
}
.form-group input::placeholder{color:rgba(255,255,255,0.4)}
.form-group input:focus{outline:none;border-color:#85B7EB}
.btn-login{
  width:100%;padding:12px;border:none;
  border-radius:10px;
  background:#85B7EB;color:#042C53;
  font-size:14px;font-weight:500;cursor:pointer;
  margin-top:4px;transition:opacity .15s;
}
.btn-login:hover{opacity:.88}
#mensaje{
  text-align:center;font-size:13px;
  margin-top:12px;min-height:20px;color:#FAC775;
}
.registro-link{
  text-align:center;font-size:12px;
  margin-top:14px;color:rgba(255,255,255,0.5);
}
.registro-link a{
  color:#85B7EB;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="card">
  <div class="logo">
    <div class="logo-circle">&#x1F4D6;</div>
    <h1>Equilibrio Estudiantil</h1>
    <p>Concentración · Bienestar · Productividad</p>
  </div>

  <div class="form-group">
    <input type="email" id="correo" placeholder="Correo universitario">
  </div>

  <div class="form-group">
    <input type="password" id="contrasena" placeholder="Contraseña">
  </div>

  <button class="btn-login" onclick="login()">Iniciar sesión</button>

  <p id="mensaje"></p>

  <div class="registro-link">
    ¿No tienes cuenta? 
    <a href="registro.html">Regístrate</a>
  </div>
</div>

<script>
const API = "http://localhost:5000";

function login() {
  const correo = document.getElementById('correo').value.trim();
  const contrasena = document.getElementById('contrasena').value.trim();
  const msg = document.getElementById('mensaje');

  if (!correo || !contrasena) {
    msg.innerText = "Completa todos los campos";
    return;
  }

  fetch(`${API}/login`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      email: correo,
      password: contrasena
    })
  })
  .then(res => res.json())
  .then(data => {
    if (data.status === "success") {
      localStorage.setItem("usuario", JSON.stringify(data.data));
      msg.style.color = "#9FE1CB";
      msg.innerText = "Bienvenido/a " + data.data.nombre;

      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 800);

    } else {
      msg.style.color = "#FAC775";
      msg.innerText = data.message || "Credenciales incorrectas";
    }
  })
  .catch(() => {
    msg.style.color = "#F09595";
    msg.innerText = "Error conectando al sistema";
  });
}
</script>

</body>
</html>
