<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estado de ánimo - Equilibrio Estudiantil</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f0f4f8;display:flex;justify-content:center;align-items:center;min-height:100vh}
.layout{display:flex;width:700px;min-height:420px;border-radius:16px;overflow:hidden;border:1px solid #ddd;background:#fff}
.sidebar{width:180px;background:#85B7EB;display:flex;flex-direction:column;align-items:center;padding:24px 12px;gap:16px}
.logo-box{width:110px;height:110px;background:#fff;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.logo-icon{font-size:40px}
.logo-text{font-size:11px;font-weight:bold;color:#185FA5;text-align:center;line-height:1.3}
.nav-link{font-size:11px;color:#042C53;cursor:pointer;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,0.3);width:100%;text-align:center;display:block;text-decoration:none}
.nav-link:hover{background:rgba(255,255,255,0.5)}
.main{flex:1;padding:24px 20px;display:flex;flex-direction:column;gap:16px;background:#f7f9fb}
.page-title{font-size:18px;font-weight:600;color:#222}
.page-sub{font-size:12px;color:#666;margin-top:4px}
.mood-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.mood-option{border:2px solid #e0e0e0;background:#fff;border-radius:12px;padding:20px 8px;text-align:center;cursor:pointer;transition:all .15s}
.mood-option:hover{border-color:#85B7EB}
.mood-option.selected-feliz{border-color:#1D9E75;background:#EAF3DE}
.mood-option.selected-normal{border-color:#378ADD;background:#E6F1FB}
.mood-option.selected-estresado{border-color:#E24B4A;background:#FCEBEB}
.mood-emoji{font-size:32px;margin-bottom:8px}
.mood-name{font-size:13px;font-weight:bold;color:#333}
.notes-area{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:10px;font-size:13px;resize:none;min-height:80px;font-family:inherit}
.notes-area:focus{outline:none;border-color:#85B7EB}
.btn-guardar{width:100%;padding:12px;border:none;border-radius:10px;background:#85B7EB;color:#042C53;font-size:14px;font-weight:bold;cursor:pointer;transition:opacity .15s}
.btn-guardar:hover{opacity:.88}
#msg-animo{text-align:center;font-size:13px;min-height:18px;color:#1D9E75}
.historial-titulo{font-size:13px;font-weight:bold;color:#555;margin-top:4px}
.historial-lista{display:flex;gap:10px;flex-wrap:wrap}
.historial-item{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:6px 12px;font-size:12px;color:#555}
</style>
</head>
<body>

<div class="layout">
  <div class="sidebar">
    <div class="logo-box">
      <div class="logo-icon">&#x1F4D6;</div>
      <div class="logo-text">Equilibrio<br>Estudiantil</div>
    </div>
    <a class="nav-link" href="Dashboard.html">Dashboard</a>
    <a class="nav-link" href="animo.html">Estado de ánimo</a>
    <a class="nav-link" href="sugerencias.html">Sugerencias</a>
    <a class="nav-link" onclick="logout()">Cerrar sesión</a>
  </div>

  <div class="main">
    <div>
      <div class="page-title">¿Cómo te sientes ahora?</div>
      <div class="page-sub">El sistema usará esto para darte sugerencias personalizadas</div>
    </div>

    <div class="mood-grid">
      <div class="mood-option" id="op-feliz" onclick="seleccionar('feliz')">
        <div class="mood-emoji">&#x1F60A;</div>
        <div class="mood-name">Feliz</div>
      </div>
      <div class="mood-option" id="op-normal" onclick="seleccionar('normal')">
        <div class="mood-emoji">&#x1F60C;</div>
        <div class="mood-name">Normal</div>
      </div>
      <div class="mood-option" id="op-estresado" onclick="seleccionar('estresado')">
        <div class="mood-emoji">&#x1F628;</div>
        <div class="mood-name">Estresado/a</div>
      </div>
    </div>

    <textarea class="notes-area" id="nota" placeholder="Nota opcional: ¿algo que quieras registrar?"></textarea>

    <button class="btn-guardar" onclick="guardar()">Guardar estado de ánimo</button>
    <p id="msg-animo"></p>

    <div class="historial-titulo">Registros recientes</div>
    <div class="historial-lista" id="historial"></div>
  </div>
</div>

<script>
const API = "http://localhost:5000";
let seleccionado = null;

const usuario = JSON.parse(localStorage.getItem("usuario"));
if (!usuario) { window.location.href = "index.html"; }

function seleccionar(estado) {
  seleccionado = estado;
  ["feliz","normal","estresado"].forEach(e => {
    document.getElementById("op-" + e).className = "mood-option";
  });
  document.getElementById("op-" + estado).className = "mood-option selected-" + estado;
}

function guardar() {
  if (!seleccionado) {
    document.getElementById("msg-animo").style.color = "#E24B4A";
    document.getElementById("msg-animo").innerText = "Selecciona un estado primero";
    return;
  }

  fetch(`${API}/mood`, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({estado: seleccionado})
  })
  .then(res => res.json())
  .then(data => {
    document.getElementById("msg-animo").style.color = "#1D9E75";
    document.getElementById("msg-animo").innerText = "Estado guardado correctamente";
    document.getElementById("nota").value = "";
    seleccionado = null;
    ["feliz","normal","estresado"].forEach(e => {
      document.getElementById("op-" + e).className = "mood-option";
    });
    cargarHistorial();
    setTimeout(() => { window.location.href = "sugerencias.html"; }, 1000);
  })
  .catch(() => {
    document.getElementById("msg-animo").style.color = "#E24B4A";
    document.getElementById("msg-animo").innerText = "Error guardando estado";
  });
}

function cargarHistorial() {
  fetch(`${API}/mood`)
    .then(res => res.json())
    .then(data => {
      const items = data.data?.items || [];
      const cont = document.getElementById("historial");
      const emojis = {feliz:"&#x1F60A;", normal:"&#x1F60C;", estresado:"&#x1F628;"};
      cont.innerHTML = items.slice(-5).reverse().map(m =>
        `<div class="historial-item">${emojis[m.estado] || ""} ${m.estado} · ${new Date(m.fecha).toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"})}</div>`
      ).join("");
    })
    .catch(() => {});
}

function logout() {
  localStorage.removeItem("usuario");
  window.location.href = "index.html";
}

cargarHistorial();
</script>

</body>
</html>
