<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sugerencias - Equilibrio Estudiantil</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f0f4f8;display:flex;justify-content:center;align-items:center;min-height:100vh}
.layout{display:flex;width:700px;min-height:420px;border-radius:16px;overflow:hidden;border:1px solid #ddd;background:#fff}
.sidebar{width:180px;background:#85B7EB;display:flex;flex-direction:column;align-items:center;padding:24px 12px;gap:16px}
.logo-box{width:110px;height:110px;background:#fff;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.logo-icon{font-size:40px}
.logo-text{font-size:11px;font-weight:bold;color:#185FA5;text-align:center;line-height:1.3}
.nav-link{font-size:11px;color:#042C53;cursor:pointer;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,0.3);width:100%;text-align:center;display:block;text-decoration:none}
.nav-link:hover{background:rgba(255,255,255,0.5)}
.main{flex:1;padding:24px 20px;display:flex;flex-direction:column;gap:14px;background:#f7f9fb}
.page-title{font-size:18px;font-weight:600;color:#222}
.page-sub{font-size:12px;color:#666;margin-top:4px}
.rec-card{border-radius:12px;padding:14px 16px;display:flex;align-items:flex-start;gap:12px;border:1px solid}
.rec-verde{background:#EAF3DE;border-color:#97C459}
.rec-azul{background:#E6F1FB;border-color:#85B7EB}
.rec-rojo{background:#FAECE7;border-color:#F0997B}
.rec-morado{background:#EEEDFE;border-color:#AFA9EC}
.rec-icon{font-size:22px;flex-shrink:0}
.rec-titulo{font-size:13px;font-weight:bold;margin-bottom:3px}
.rec-verde .rec-titulo{color:#27500A}
.rec-azul .rec-titulo{color:#0C447C}
.rec-rojo .rec-titulo{color:#712B13}
.rec-morado .rec-titulo{color:#3C3489}
.rec-desc{font-size:12px;color:#555;line-height:1.5}
.estado-actual{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:12px 16px;font-size:13px;color:#555}
.estado-actual strong{color:#333}
</style>
</head>
<body>

<div class="layout">
  <div class="sidebar">
    <div class="logo-box">
      <div class="logo-icon">&#x1F4D6;</div>
      <div class="logo-text">Equilibrio<br>Estudiantil</div>
    </div>
    <a class="nav-link" href="Dashboard.html">Dashboard</a>
    <a class="nav-link" href="animo.html">Estado de ánimo</a>
    <a class="nav-link" href="sugerencias.html">Sugerencias</a>
    <a class="nav-link" onclick="logout()">Cerrar sesión</a>
  </div>

  <div class="main">
    <div>
      <div class="page-title">Sugerencias personalizadas</div>
      <div class="page-sub">Basadas en tu estado de ánimo registrado</div>
    </div>

    <div class="estado-actual" id="estado-actual">
      Cargando tu estado de ánimo...
    </div>

    <div id="sugerencias-container"></div>
  </div>
</div>

<script>
const API = "http://localhost:5000";

const usuario = JSON.parse(localStorage.getItem("usuario"));
if (!usuario) { window.location.href = "index.html"; }

const sugerencias = {
  feliz: [
    {tipo:"rec-verde", icon:"&#x1F4DA;", titulo:"Aprovecha tu energía", desc:"Estás en un buen momento para estudiar temas difíciles. Inicia una sesión Pomodoro de 25 minutos."},
    {tipo:"rec-azul", icon:"&#x1F4A7;", titulo:"Mantente hidratado/a", desc:"Beber agua mejora la concentración hasta un 14%. Toma un vaso antes de comenzar."},
    {tipo:"rec-morado", icon:"&#x1F3AF;", titulo:"Establece una meta", desc:"Anota qué quieres lograr hoy. Las metas escritas tienen mayor tasa de cumplimiento."}
  ],
  normal: [
    {tipo:"rec-azul", icon:"&#x23F1;", titulo:"Inicia un Pomodoro", desc:"Tu estado es estable. 25 minutos de foco seguidos de 5 de descanso es la fórmula ideal ahora."},
    {tipo:"rec-verde", icon:"&#x1F6B6;", titulo:"Descanso activo", desc:"Entre sesiones camina 5 minutos. Reduce el cortisol y mejora la memoria de trabajo."},
    {tipo:"rec-morado", icon:"&#x1F4F5;", titulo:"Silencia notificaciones", desc:"Activa modo no molestar en tu celular durante las sesiones de estudio."}
  ],
  estresado: [
    {tipo:"rec-rojo", icon:"&#x1F9D8;", titulo:"Respira profundo", desc:"Toma 3 respiraciones lentas: inhala 4 segundos, mantén 4, exhala 6. Activa el sistema nervioso parasimpático."},
    {tipo:"rec-verde", icon:"&#x1F4A7;", titulo:"Hidrátate ahora", desc:"El estrés deshidrata. Bebe un vaso de agua antes de continuar estudiando."},
    {tipo:"rec-azul", icon:"&#x23F0;", titulo:"Reduce el tiempo de foco", desc:"Si estás estresado/a usa Pomodoros de 15 minutos con descansos de 5. Avanza poco a poco."},
    {tipo:"rec-morado", icon:"&#x1F4DE;", titulo:"Habla con alguien", desc:"Compartir lo que sientes reduce el estrés. Contacta a un compañero, familiar o la orientación universitaria."}
  ]
};

function cargarSugerencias() {
  fetch(`${API}/mood`)
    .then(res => res.json())
    .then(data => {
      const items = data.data?.items || [];
      let estado = "normal";

      if (items.length > 0) {
        estado = items[items.length - 1].estado;
      }

      const emojis = {feliz:"&#x1F60A;", normal:"&#x1F60C;", estresado:"&#x1F628;"};
      document.getElementById("estado-actual").innerHTML =
        `<strong>Tu último estado:</strong> ${emojis[estado]} ${estado.charAt(0).toUpperCase() + estado.slice(1)}`;

      const lista = sugerencias[estado] || sugerencias.normal;
      const cont = document.getElementById("sugerencias-container");
      cont.innerHTML = lista.map(s => `
        <div class="rec-card ${s.tipo}" style="margin-bottom:10px">
          <div class="rec-icon">${s.icon}</div>
          <div>
            <div class="rec-titulo">${s.titulo}</div>
            <div class="rec-desc">${s.desc}</div>
          </div>
        </div>
      `).join("");
    })
    .catch(() => {
      document.getElementById("estado-actual").innerText = "No se pudo cargar el estado. Ve a registrar tu ánimo.";
      const lista = sugerencias.normal;
      document.getElementById("sugerencias-container").innerHTML = lista.map(s => `
        <div class="rec-card ${s.tipo}" style="margin-bottom:10px">
          <div class="rec-icon">${s.icon}</div>
          <div>
            <div class="rec-titulo">${s.titulo}</div>
            <div class="rec-desc">${s.desc}</div>
          </div>
        </div>
      `).join("");
    });
}

function logout() {
  localStorage.removeItem("usuario");
  window.location.href = "index.html";
}

cargarSugerencias();
</script>

</body>
</html>
